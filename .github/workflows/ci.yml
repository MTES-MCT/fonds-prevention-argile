name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

# Aucun droit par défaut : chaque job déclare les siens (docs/security/CONTROLES-CI.md).
permissions: {}

jobs:
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Talisman
        env:
          TALISMAN_VERSION: v1.37.0
          TALISMAN_SHA256: 8e0ae8bb7b160bf10c4fa1448beb04a32a35e63505b3dddff74a092bccaaa7e4
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/thoughtworks/talisman/releases/download/${TALISMAN_VERSION}/talisman_linux_amd64" \
            -o "${RUNNER_TEMP}/talisman"
          echo "${TALISMAN_SHA256}  ${RUNNER_TEMP}/talisman" | sha256sum --check --strict
          chmod +x "${RUNNER_TEMP}/talisman"

      - name: Detect secrets with Talisman
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          head_sha="${PR_HEAD_SHA:-$GITHUB_SHA}"
          base_sha="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"

          # Branche neuve ou historique réécrit : pas de commit précédent, on part de la divergence avec main.
          if [ -z "$base_sha" ] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha=$(git merge-base "$head_sha" origin/main)
          fi

          # Le mode pre-commit ne lit que l'index, vide en CI : seul pre-push scanne des commits.
          echo "Scan des commits ${base_sha}..${head_sha}"
          echo "refs/heads/ci ${head_sha} refs/heads/ci ${base_sha}" \
            | "${RUNNER_TEMP}/talisman" --githook pre-push \
            || { echo "::error::Talisman a détecté un secret potentiel dans les commits scannés"; exit 1; }

  ci:
    name: Test, Lint & Build
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript checks
        run: pnpm typecheck

      - name: Run ESLint
        run: pnpm lint

      - name: Run tests
        run: pnpm test
        env:
          # Variables d'environnement pour les tests
          NODE_ENV: test
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_USER: "fonds_argile_user"
          DB_PASSWORD: "fonds_argile_password"
          DB_NAME: "fonds_argile"

      - name: Build application
        run: pnpm build
        # Valeurs d'exemple, reprises telles quelles par le contrôle des en-têtes (ancre YAML).
        env: &env_application
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_DEMARCHES_SIMPLIFIEES_BASE_URL: https://www.demarches-simplifiees.fr
          DEMARCHES_SIMPLIFIEES_GRAPHQL_API_KEY: "API_KEY_EXAMPLE"
          DEMARCHES_SIMPLIFIEES_GRAPHQL_API_URL: https://www.demarches-simplifiees.fr/api/v2/graphql
          DEMARCHES_SIMPLIFIEES_REST_API_URL: https://www.demarches-simplifiees.fr/api/public/v1
          DEMARCHES_SIMPLIFIEES_INSTRUCTEUR_ID: "INSTRUCTEUR_ID_EXAMPLE"
          DEMARCHES_SIMPLIFIEES_ID_ELIGIBILITE: "126061"
          DEMARCHES_SIMPLIFIEES_ID_DIAGNOSTIC: "126062"
          DEMARCHES_SIMPLIFIEES_ID_DEVIS: "126063"
          DEMARCHES_SIMPLIFIEES_ID_FACTURES: "126064"
          JWT_SECRET: "supersecretkeywithmorethan32characters"
          FC_CLIENT_ID: "exampleclientid"
          FC_CLIENT_SECRET: "exampleclientsecret"
          FC_CALLBACK_URL: "http://localhost:3000/api/auth/callback"
          FC_POST_LOGOUT_URL: "http://localhost:3000/"
          FC_BASE_URL: "https://app.franceconnect.gouv.fr"
          FC_SCOPES: "openid email profile"
          FC_ACR_VALUES: "eidas1"
          FC_STATE_TTL: "300"
          BASE_URL: "http://localhost:3000"
          DB_HOST: "localhost"
          DB_PORT: "5432"
          DB_USER: "fonds_argile_user"
          DB_PASSWORD: "fonds_argile_password"
          DB_NAME: "fonds_argile"
          BREVO_API_KEY: "BREVO_API_KEY_EXAMPLE"
          BREVO_WEBHOOK_SECRET: "BREVO_WEBHOOK_SECRET_EXAMPLE_1234567890abcdef"
          EMAIL_FROM: "noreply@fonds-argile.local"
          MATOMO_API_TOKEN: "MATOMO_API_TOKEN_EXAMPLE"
          NEXT_PUBLIC_MATOMO_URL: "https://stats.beta.gouv.fr"
          NEXT_PUBLIC_MATOMO_FUNNEL_ID: "1"
          NEXT_PUBLIC_MATOMO_SITE_ID: "111"
          RGA_ENCRYPTION_KEY: "12345678901234567890123456789012"
          CRON_SECRET: "CRON_SECRET_EXAMPLE_1234567890abcdef0123456789"
          PC_CLIENT_ID: "proconnectclientid"
          PC_CLIENT_SECRET: "proconnectclientsecret"
          PC_CALLBACK_URL: "http://localhost:3000/api/proconnect/callback"
          PC_POST_LOGOUT_URL: "http://localhost:3000/"
          PC_BASE_URL: "https://proconnect.gouv.fr"
          PC_SCOPES: "openid email"
          PC_ACR_VALUES: "eidas1"
          PC_STATE_TTL: "300"

      # Le serveur de production réel : seul moyen de voir ce que Next et le middleware servent vraiment.
      - name: Check HTTP security headers on the built app
        env: *env_application
        run: |
          set -euo pipefail
          pnpm start > "${RUNNER_TEMP}/next.log" 2>&1 &

          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:3000/robots.txt && break
            sleep 1
          done

          pnpm -s audit:en-tetes http://localhost:3000 || { cat "${RUNNER_TEMP}/next.log"; exit 1; }

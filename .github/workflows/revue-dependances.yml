name: Revue des dépendances

# Refuse une PR qui ajoute ou met à jour une dépendance vers une version vulnérable (High ou
# Critical), ou sous une licence absente de la liste. Ne juge que ce que la PR change : une
# faille publiée sur une dépendance déjà en place relève de veille-dependances.yml.
# Doc : docs/security/CONTROLES-CI.md.

on:
  pull_request:
    branches: [main, dev]

permissions: {}

jobs:
  revue:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          # Mêmes exceptions que auditConfig.ignoreGhsas (pnpm-workspace.yaml).
          allow-ghsas: GHSA-fc5q-39xc-vjpf
          # Licences déjà présentes dans l'arbre : une licence nouvelle demande une relecture humaine.
          allow-licenses: >-
            MIT, MIT-0, ISC, 0BSD, Apache-2.0, BSD-2-Clause, BSD-2-Clause-Views, BSD-3-Clause,
            BlueOak-1.0.0, CC0-1.0, CC-BY-4.0, MPL-2.0, LGPL-3.0-or-later, Python-2.0, Unlicense,
            Zlib, etalab-2.0

<svg width="614" height="215" viewBox="0 0 614 215" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="schema-source-chaleur-titre schema-source-chaleur-desc">
<title id="schema-source-chaleur-titre">Source de chaleur en sous-sol contre un mur extérieur</title>
<desc id="schema-source-chaleur-desc">Maison vue en coupe avec un sous-sol. Une chaudière est placée contre un mur donnant sur l'extérieur. Une flèche rouge surmontée d'un triangle d'avertissement pointe ce mur : s'il n'est pas isolé, la chaleur peut assécher le sol argileux de l'autre côté.</desc>
